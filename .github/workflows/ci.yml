name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Линт
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: SQL миграции и сид на реальном Postgres
        run: npm run db:verify

      - name: Сборка
        run: npm run build
