name: Баг
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Открыть /app
        2. Войти как anna@example.com
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Окружение
      placeholder: Chrome 130, Android 14 / Node 22, локальный запуск
